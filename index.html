<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Абилтай Тогжан - Визитка</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .card {
            width: 800px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .photo {
            width: 140px;
            height: 140px;
            margin: auto;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        h1 {
            color: #4b5bdc;
            margin-bottom: 5px;
        }

        h2 {
            color: #555;
            font-size: 20px;
        }

        .info {
            text-align: left;
            margin-top: 30px;
            line-height: 1.8;
        }

        .info p {
            border-bottom: 1px solid #ddd;
            padding: 8px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .skill {
            background: #4b5bdc;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #4b5bdc;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .button:hover {
            background: #3444b5;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="photo">
        👩🏻‍💻
    </div>

    <h1>Абилтай Тогжан</h1>

    <h2>IT студенті</h2>

    <p>
        Ақпараттық технологиялар саласында білім алып жатқан студент.
    </p>

    <div class="info">

        <p><b>🎓 Мамандығы:</b> Ақпараттық жүйелер</p>

        <p><b>📚 Курс:</b> 2 курс</p>

        <p><b>📍 Қала:</b> Алматы</p>

        <p><b>💻 Қызығушылығы:</b> Бағдарламалау және веб-сайт жасау</p>

    </div>

    <h2>Менің дағдыларым</h2>

    <div class="skills">
        <div class="skill">HTML</div>
        <div class="skill">CSS</div>
        <div class="skill">Java</div>
        <div class="skill">SQL</div>
        <div class="skill">Python</div>
    </div>

    <a href="mailto:example@gmail.com" class="button">
        Маған хабарласу
    </a>

</div>

</body>
</html>
